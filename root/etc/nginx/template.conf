## Version 2024/12/17 - Changelog: https://github.com/linuxserver/docker-baseimage-alpine-nginx/commits/master/root/defaults/nginx/nginx.conf.sample

### Based on alpine defaults
# https://git.alpinelinux.org/aports/tree/main/nginx/nginx.conf?h=3.21-stable

user abc;

# Set number of worker processes automatically based on number of CPU cores.
include /config/worker_processes.conf;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Configures default error logger.
error_log /config/logs/nginx/error.log;

# Includes files with directives to load dynamic modules.
include /etc/nginx/modules/*.conf;

# Include files with config snippets into the root context.
include /etc/nginx/conf.d/*.conf;

events {
    # The maximum number of simultaneous connections that can be opened by
    # a worker process.
    worker_connections 1024;
}

http {
    # Includes mapping of file name extensions to MIME types of responses
    # and defines the default type.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Name servers used to resolve names of upstream servers into addresses.
    # It's also needed when using tcpsocket and udpsocket in Lua modules.
    resolver 127.0.0.11 valid=30s;
    #include /config/nginx/resolver.conf;

    # Don't tell nginx version to the clients. Default is 'on'.
    server_tokens off;

    # MUST MATCH post_max_size IN /etc/php85/conf.d/starrproxy.ini (CVE-2026-109618 MITIGATION)
    client_max_body_size 8M;

    # Sendfile copies data between one FD and other from within the kernel,
    # which is more efficient than read() + write(). Default is off.
    sendfile on;

    # Causes nginx to attempt to send its HTTP response head in one packet,
    # instead of using partial frames. Default is 'off'.
    tcp_nopush on;

    # all ssl related config moved to ssl.conf
    # included in server blocks where listen 443 is defined

    # Enable gzipping of responses.
    #gzip on;

    # Set the Vary HTTP header as defined in the RFC 2616. Default is 'off'.
    gzip_vary on;

    # Helper variable for proxying websockets.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Forward Upgrade to the arr only for real websocket upgrades (SignalR); anything else (h2c etc.) is dropped.
    map $http_upgrade $signalr_upgrade {
        default '';
        ~*^websocket$ websocket;
    }
    map $signalr_upgrade $signalr_connection {
        default upgrade;
        '' close;
    }

    # Long-lived SignalR websockets: cap concurrent connections per client address.
    limit_conn_zone $binary_remote_addr zone=signalr:10m;

    # Enable http2 by default for all servers
    # http2 on;

    # Sets the path, format, and configuration for a buffered log write.
    access_log /config/logs/nginx/access.log;

    # client_body_temp_path /tmp/nginx 1 2;
    # proxy_temp_path /tmp/nginx-proxy;
    # fastcgi_temp_path /tmp/nginx-fastcgi;
    # uwsgi_temp_path /tmp/nginx-uwsgi;
    # scgi_temp_path /tmp/nginx-scgi;

    # proxy_cache_path /tmp/nginx-proxy-cache keys_zone=lsio-proxy:10m;
    # fastcgi_cache_path /tmp/nginx-fcgi-cache keys_zone=lsio-fcgi:10m;
    # scgi_cache_path /tmp/nginx-scgi-cache keys_zone=lsio-scgi:10m;
    # uwsgi_cache_path /tmp/nginx-uwsgi-cache keys_zone=lsio-uwsgi:10m;

    # Prevent gateway timeouts
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;

    # Includes virtual hosts configs.
    include /etc/nginx/http.d/*.conf;
    # include /config/nginx/site-confs/*.conf;

    # Preserve port in redirects
    port_in_redirect on;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        set $root /app/www/public;
        if (!-d /app/www/public) {
            set $root /config/www;
        }

        index index.php;

        # Alias is set to public root
        location / {
            alias $root/;
            index index.php;
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~ ^/(.+\.php)$ {
            alias $root/;
            fastcgi_split_path_info ^/(.+\.php)(.*)$;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $root/$1;
            fastcgi_ignore_headers X-Accel-Redirect;
            fastcgi_index index.php;
        }

        # API routing
        location ~ ^(.*)/api/(.*)$ {
            alias $root/;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $root/api/index.php;
            fastcgi_ignore_headers X-Accel-Redirect;
            fastcgi_param QUERY_STRING endpoint=/api/$2&$args;
            fastcgi_index index.php;
        }

        # SignalR must stay at the NGINX layer because PHP cURL cannot proxy WebSockets.
        # Auth, endpoint, and method checks run in a PHP script outside the web root, reachable only from here.
        location = /signalr-auth {
            internal;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/www/signalr-auth.php;
            fastcgi_ignore_headers X-Accel-Redirect;
            fastcgi_param QUERY_STRING "";
            fastcgi_param SIGNALR_SUBREQUEST 1;
            fastcgi_param ORIG_URI $request_uri;
            # auth_request subrequests are always GET; $request_method returns the client's original method.
            fastcgi_param STARR_CLIENT_METHOD $request_method;
            fastcgi_pass_request_body off;
            fastcgi_param CONTENT_LENGTH "";
        }

        location ~ ^(.*)/feed/(.*)$ {
            alias $root/;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $root/api/index.php;
            fastcgi_ignore_headers X-Accel-Redirect;
            fastcgi_param QUERY_STRING feed=/feed/$2&$args;
            fastcgi_index index.php;
        }
        location ~ ^(.*)/backup/(.*)$ {
            alias $root/;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $root/api/index.php;
            fastcgi_ignore_headers X-Accel-Redirect;
            fastcgi_param QUERY_STRING backup=/backup/$2&$args;
            fastcgi_index index.php;
        }

        location = /api {
            default_type application/json;
            return 404 '{"error":"Starr Proxy: Invalid starr route"}';
        }
        location = /feed {
            default_type application/json;
            return 404 '{"error":"Starr Proxy: Invalid starr route"}';
        }
        location = /backup {
            default_type application/json;
            return 404 '{"error":"Starr Proxy: Invalid starr route"}';
        }
        location ~ ^.*\/(?:api|feed|backup)(?:$|\/) {
            default_type application/json;
            return 404 '{"error":"Starr Proxy: Invalid starr route"}';
        }

        location ~ ^(.*)/signalr/(.*)$ {
            alias $root/;
            auth_request /signalr-auth;
            auth_request_set $signalr_backend $upstream_http_x_starr_backend_url;
            auth_request_set $signalr_endpoint $upstream_http_x_starr_endpoint;
            auth_request_set $signalr_args $upstream_http_x_starr_proxy_args;
            auth_request_set $signalr_key $upstream_http_x_starr_api_key;
            proxy_http_version 1.1;
            limit_conn signalr 10;
            limit_conn_status 429;
            proxy_ignore_headers X-Accel-Redirect;
            proxy_set_header Upgrade $signalr_upgrade;
            proxy_set_header Connection $signalr_connection;
            proxy_set_header X-Api-Key $signalr_key;
            proxy_set_header Authorization "";
            proxy_pass $signalr_backend$signalr_endpoint$signalr_args;
            proxy_read_timeout 300s;
        }

        # Health check
        location /health {
            return 200 'healthy';
            add_header Content-Type text/plain;
        }

        # Deny .ht*
        location ~ /\.ht {
            deny all;
        }
    }
}

daemon off;
pid /run/nginx.pid;
